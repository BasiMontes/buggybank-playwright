# ------------------------------------------------------------------------------
# Pruebas de BuggyBank en GitHub Actions
#
# La suite se reparte en 3 jobs que corren A LA VEZ, cada uno con SU PROPIO sandbox
# (así los saldos no se pisan). Después, un job junta los resultados y otro publica
# el informe HTML en GitHub Pages:
#
#   ┌ Pruebas (parte 1 de 3) ┐
#   ├ Pruebas (parte 2 de 3) ┼──▶ Resumen ──▶ Publicar informe (solo desde main)
#   └ Pruebas (parte 3 de 3) ┘
#
#   Resumen: fusiona los informes, compara con los rojos conocidos y sube el informe
#   HTML como artefacto. Publicar informe: lo deja en
#   https://basimontes.github.io/buggybank-playwright/ para verlo en el navegador.
#
# Cada parte:
#   1. Instala dependencias y Chromium.
#   2. Crea un sandbox NUEVO de BuggyBank con el código del curso (secreto BB_COURSE_CODE).
#      Ver src/config/globalSetup.ts.
#   3. Ejecuta su tercio de la suite (`--shard=N/3`, que reparte prueba por prueba).
#
# El resumen deja el pipeline VERDE cuando los únicos rojos son los bugs conocidos
# (ci/expected-results.json), y ROJO cuando cambia algo: un fallo nuevo, un bug conocido
# que deja de fallar (¿lo corrigieron?) o pruebas que no llegaron a ejecutarse.
# Las pruebas no se modifican para conseguir el verde: siguen en rojo en el informe.
#
# Configuración necesaria (una sola vez):
#   Settings → Secrets and variables → Actions → New repository secret
#   Nombre: BB_COURSE_CODE   Valor: el código del curso
# ------------------------------------------------------------------------------
name: Pruebas BuggyBank

on:
  # Cada cambio en main y cada pull request: ¿rompí algo?
  push:
    branches: [main]
  pull_request:
  # Todos los días: la app cambia aunque el repo no. Así se ve cuándo se corrige un bug
  # o aparece uno nuevo. (06:17 UTC = 07:17 en Madrid en invierno.)
  schedule:
    - cron: '17 6 * * *'
  # Botón "Run workflow" en la pestaña Actions, con opciones.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Qué pruebas ejecutar'
        type: choice
        options: [todas, core, sin-core]
        default: todas
      estricto:
        description: 'Modo estricto: fallar ante cualquier rojo, aunque sea un bug conocido'
        type: boolean
        default: false

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

# Si subes otro commit al mismo pull request, se cancela la ejecución anterior.
# En main no se cancela nada: cada ejecución diaria queda completa en el historial.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qué pruebas ejecutar. Las entradas del formulario se pasan como variables de entorno
  # y no se pegan dentro de los scripts: así no se pueden usar para inyectar comandos.
  SUITE: ${{ inputs.suite || 'todas' }}

jobs:
  pruebas:
    name: Pruebas (parte ${{ matrix.parte }} de 3)
    runs-on: ubuntu-latest
    # Cada parte tarda unos 4–6 minutos; damos margen.
    timeout-minutes: 25
    strategy:
      # Si una parte falla, las otras siguen: queremos todos los resultados.
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        # Basta con hacerlo en una de las tres partes.
        if: ${{ matrix.parte == 1 }}
        run: npm run typecheck

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        # Las pruebas en rojo por bugs conocidos son esperables: no cortamos aquí.
        # El job "Resumen" decide si el pipeline falla.
        continue-on-error: true
        env:
          BB_COURSE_CODE: ${{ secrets.BB_COURSE_CODE }}
          PARTE: ${{ matrix.parte }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          case "$SUITE" in
            core)     FILTRO="--grep @core" ;;
            sin-core) FILTRO="--grep-invert @core" ;;
            *)        FILTRO="" ;;
          esac
          npx playwright test $FILTRO --shard="$PARTE/$TOTAL"

      - name: Guardar el reporte de esta parte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.parte }}
          path: blob-report/
          # Solo lo necesita el job "Resumen", unos minutos después.
          retention-days: 1
          if-no-files-found: ignore

  resumen:
    name: Resumen
    needs: pruebas
    # Se ejecuta aunque alguna parte haya fallado: justamente queremos el resumen.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # Hace falta Playwright para fusionar los informes (no hace falta Chromium).
        run: npm ci

      - name: Descargar los reportes de las 3 partes
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Fusionar en un único informe
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports
          PLAYWRIGHT_JSON_OUTPUT_NAME=results-ci.json npx playwright merge-reports --reporter json ./all-blob-reports

      - name: Listar las pruebas que debían ejecutarse
        # Sirve para detectar pruebas que faltan en el informe (por ejemplo, si una parte
        # se cayó antes de terminar). --list no crea sandbox ni ejecuta nada.
        run: |
          case "$SUITE" in
            core)     FILTRO="--grep @core" ;;
            sin-core) FILTRO="--grep-invert @core" ;;
            *)        FILTRO="" ;;
          esac
          npx playwright test $FILTRO --list --reporter=json > list-ci.json

      - name: Comparar con los resultados esperados
        env:
          ESTRICTO: ${{ inputs.estricto || 'false' }}
        run: node scripts/ci-summary.mjs results-ci.json ci/expected-results.json list-ci.json

      - name: Subir informe de Playwright (artefacto descargable)
        id: informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          # Las trazas guardan el login de los sandboxes de esa ejecución. Son desechables
          # (caducan en 24 h), pero no hace falta guardarlos más de una semana.
          retention-days: 7
          if-no-files-found: ignore

      - name: Preparar el informe para GitHub Pages
        # Solo desde main: GitHub Pages publica una única versión del sitio, la última
        # ejecución de main. Las ejecuciones de pull requests no lo pisan.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

      - name: Enlazar el informe en el resumen
        if: ${{ !cancelled() }}
        env:
          ARTEFACTO: ${{ steps.informe.outputs.artifact-url }}
          EN_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          {
            echo ""
            echo "### 📊 Informe HTML de Playwright"
            if [ "$EN_MAIN" = "true" ]; then
              echo "- **Ver en el navegador:** <$PAGES> (se publica en el job \"Publicar informe\", un minuto después)"
            else
              echo "- En pull requests el informe no se publica en GitHub Pages: se publica al llegar a \`main\`."
            fi
            if [ -n "$ARTEFACTO" ]; then
              echo "- **Descargar (.zip):** [playwright-report]($ARTEFACTO). Descomprímelo y abre \`index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Publicar informe
    needs: resumen
    # También cuando el resumen está en rojo: justo entonces es cuando más interesa
    # ver el informe. Solo desde main (ver "Preparar el informe para GitHub Pages").
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Permisos mínimos para publicar en GitHub Pages, solo en este job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Dos publicaciones a la vez se pisarían: van en fila, sin cancelar ninguna.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5

      - name: Enlazar el informe publicado
        env:
          URL: ${{ steps.despliegue.outputs.page_url }}
        run: echo "### 📊 [Informe HTML de esta ejecución]($URL)" >> "$GITHUB_STEP_SUMMARY"
