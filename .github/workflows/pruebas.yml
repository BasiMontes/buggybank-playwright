# ------------------------------------------------------------------------------
# Pruebas de BuggyBank en GitHub Actions
#
# La suite se reparte en 3 jobs que corren A LA VEZ, cada uno con SU PROPIO sandbox
# (así los saldos no se pisan). Después, un job junta los resultados y otro publica
# el informe HTML en GitHub Pages:
#
#   ┌ Pruebas (parte 1 de 3) ┐
#   ├ Pruebas (parte 2 de 3) ┼──▶ Resumen ──▶ Publicar informe (solo desde main)
#   └ Pruebas (parte 3 de 3) ┘
#
#   Resumen: fusiona los informes, compara con los rojos conocidos y sube el informe
#   HTML como artefacto (30 días). Publicar informe: anota la ejecución en la rama
#   `historial` (para siempre) y publica en https://basimontes.github.io/buggybank-playwright/
#   el último informe, el historial y los informes de las últimas 15 ejecuciones.
#   Ver docs/CI.md, "Problema 5".
#
# Cada parte:
#   1. Instala dependencias y Chromium.
#   2. Crea un sandbox NUEVO de BuggyBank con el código del curso (secreto BB_COURSE_CODE).
#      Ver src/config/globalSetup.ts.
#   3. Ejecuta su tercio de la suite (`--shard=N/3`, que reparte prueba por prueba).
#
# El resumen deja el pipeline VERDE cuando los únicos rojos son los bugs conocidos
# (ci/expected-results.json), y ROJO cuando cambia algo: un fallo nuevo, un bug conocido
# que deja de fallar (¿lo corrigieron?) o pruebas que no llegaron a ejecutarse.
# Las pruebas no se modifican para conseguir el verde: siguen en rojo en el informe.
#
# Configuración necesaria (una sola vez):
#   Settings → Secrets and variables → Actions → New repository secret
#   Nombre: BB_COURSE_CODE   Valor: el código del curso
# ------------------------------------------------------------------------------
name: Pruebas BuggyBank

on:
  # Cada cambio en main y cada pull request: ¿rompí algo?
  push:
    branches: [main]
  pull_request:
  # Todos los días: la app cambia aunque el repo no. Así se ve cuándo se corrige un bug
  # o aparece uno nuevo. (06:17 UTC = 07:17 en Madrid en invierno.)
  schedule:
    - cron: '17 6 * * *'
  # Botón "Run workflow" en la pestaña Actions, con opciones.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Qué pruebas ejecutar'
        type: choice
        options: [todas, core, sin-core]
        default: todas
      estricto:
        description: 'Modo estricto: fallar ante cualquier rojo, aunque sea un bug conocido'
        type: boolean
        default: false

# Mínimo privilegio: el workflow solo necesita leer el código.
permissions:
  contents: read

# Si subes otro commit al mismo pull request, se cancela la ejecución anterior.
# En main no se cancela nada: cada ejecución diaria queda completa en el historial.
concurrency:
  # Pull requests: agrupados por su rama (github.head_ref). main: por github.ref.
  # Así una ejecución de PR nunca comparte grupo con main. Con solo github.ref, un PR
  # mergeado antes de que arrancara su ejecución usa refs/heads/main y cancelaba la
  # ejecución en curso de main (pasó el 18/11/2026 con el PR #3).
  group: pruebas-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qué pruebas ejecutar. Las entradas del formulario se pasan como variables de entorno
  # y no se pegan dentro de los scripts: así no se pueden usar para inyectar comandos.
  SUITE: ${{ inputs.suite || 'todas' }}

jobs:
  pruebas:
    name: Pruebas (parte ${{ matrix.parte }} de 3)
    runs-on: ubuntu-latest
    # Cada parte tarda unos 4–6 minutos; damos margen.
    timeout-minutes: 25
    strategy:
      # Si una parte falla, las otras siguen: queremos todos los resultados.
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        # Basta con hacerlo en una de las tres partes.
        if: ${{ matrix.parte == 1 }}
        run: npm run typecheck

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        # Las pruebas en rojo por bugs conocidos son esperables: no cortamos aquí.
        # El job "Resumen" decide si el pipeline falla.
        continue-on-error: true
        env:
          BB_COURSE_CODE: ${{ secrets.BB_COURSE_CODE }}
          PARTE: ${{ matrix.parte }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          case "$SUITE" in
            core)     FILTRO="--grep @core" ;;
            sin-core) FILTRO="--grep-invert @core" ;;
            *)        FILTRO="" ;;
          esac
          npx playwright test $FILTRO --shard="$PARTE/$TOTAL"

      - name: Guardar el reporte de esta parte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.parte }}
          path: blob-report/
          # Solo lo necesita el job "Resumen", unos minutos después.
          retention-days: 1
          if-no-files-found: ignore

  resumen:
    name: Resumen
    needs: pruebas
    # Se ejecuta aunque alguna parte haya fallado: justamente queremos el resumen.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # Hace falta Playwright para fusionar los informes (no hace falta Chromium).
        run: npm ci

      - name: Descargar los reportes de las 3 partes
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Fusionar en un único informe
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports
          PLAYWRIGHT_JSON_OUTPUT_NAME=results-ci.json npx playwright merge-reports --reporter json ./all-blob-reports

      - name: Listar las pruebas que debían ejecutarse
        # Sirve para detectar pruebas que faltan en el informe (por ejemplo, si una parte
        # se cayó antes de terminar). --list no crea sandbox ni ejecuta nada.
        run: |
          case "$SUITE" in
            core)     FILTRO="--grep @core" ;;
            sin-core) FILTRO="--grep-invert @core" ;;
            *)        FILTRO="" ;;
          esac
          npx playwright test $FILTRO --list --reporter=json > list-ci.json

      - name: Comparar con los resultados esperados
        env:
          ESTRICTO: ${{ inputs.estricto || 'false' }}
          # Además del resumen, deja los números en un JSON para el historial.
          RESUMEN_JSON: run-summary.json
        run: node scripts/ci-summary.mjs results-ci.json ci/expected-results.json list-ci.json

      - name: Subir informe de Playwright (artefacto descargable)
        id: informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          # 30 días: el job "Publicar informe" vuelve a descargar los informes de las
          # últimas 15 ejecuciones de main para publicarlos en Pages. Las trazas guardan el
          # login de sandboxes desechables (caducan en 24 h); a los 30 días desaparecen.
          retention-days: 30
          if-no-files-found: ignore

      - name: Subir los números de esta ejecución
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resumen-ci
          path: run-summary.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Enlazar el informe en el resumen
        if: ${{ !cancelled() }}
        env:
          ARTEFACTO: ${{ steps.informe.outputs.artifact-url }}
          EN_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo ""
            echo "### 📊 Informe HTML de Playwright"
            if [ "$EN_MAIN" = "true" ]; then
              echo "- **Ver en el navegador:** <${PAGES}informes/${RUN_ID}/> (se publica en el job \"Publicar informe\", un minuto después)"
              echo "- **Historial de ejecuciones:** <${PAGES}historial/>"
            else
              echo "- En pull requests el informe no se publica en GitHub Pages: se publica al llegar a \`main\`."
            fi
            if [ -n "$ARTEFACTO" ]; then
              echo "- **Descargar (.zip):** [playwright-report]($ARTEFACTO). Descomprímelo y abre \`index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Publicar informe
    needs: resumen
    # También cuando el resumen está en rojo: justo entonces es cuando más interesa
    # ver el informe. Solo desde main: los pull requests no tocan el historial ni Pages.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permisos mínimos, solo en este job:
    permissions:
      contents: write   # escribir en la rama `historial`
      actions: read     # listar y descargar los informes de ejecuciones anteriores
      pages: write      # publicar en GitHub Pages
      id-token: write   # lo exige la publicación en Pages
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Dos publicaciones a la vez se pisarían (en Pages y en la rama historial): van en
    # fila, sin cancelar ninguna.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Descargar el informe de esta ejecución
        # Si el resumen no llegó a subirlo, se publica igual el historial.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/informes/${{ github.run_id }}

      - name: Descargar los números de esta ejecución
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: resumen-ci
          path: resumen

      - name: Abrir la rama historial
        # La rama vive solo para el historial: si todavía no existe, se crea vacía
        # (--orphan: sin nada de main). Se abre en la carpeta hist/ como un "worktree".
        run: |
          if git ls-remote --exit-code --heads origin historial >/dev/null; then
            git fetch --depth=1 origin historial
            git worktree add -B historial hist FETCH_HEAD
          else
            git worktree add --orphan -b historial hist
          fi

      - name: Registrar la ejecución y armar el sitio
        env:
          SITE_DIR: site
          HIST_DIR: hist
          RESUMEN: resumen/run-summary.json
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENTO: ${{ github.event_name }}
          SUITE: ${{ inputs.suite || 'todas' }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          INFORMES_MAX: 15
        run: node scripts/publicar-informes.mjs

      - name: Guardar el historial en la rama historial
        working-directory: hist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Historial: ejecución ${{ github.run_id }} (${{ github.event_name }})"
          # Si otra ejecución empujó justo antes, se reintenta sobre lo nuevo.
          for intento in 1 2 3; do
            git push -q origin historial && exit 0
            git fetch -q --depth=1 origin historial && git rebase -q FETCH_HEAD
          done
          exit 1

      - name: Preparar el sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5

      - name: Enlazar el informe publicado
        env:
          URL: ${{ steps.despliegue.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### 📊 [Informe HTML de esta ejecución](${URL}informes/${RUN_ID}/)"
            echo "### 🗂️ [Historial de ejecuciones](${URL}historial/)"
          } >> "$GITHUB_STEP_SUMMARY"
